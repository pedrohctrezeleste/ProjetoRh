<!DOCTYPE html>

<html lang="pt-br">

<head>


<meta charset="UTF-8">

<meta http-equiv="X-UA-Compatible" content="IE=edge">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="refresh" content="5; https://visionup.rf.gd/cand.html">

<title>Registro Salvo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    .loader {
        width: 70px;
        height: 70px;
        border: 7px solid #e9ecef;
        border-top: 7px solid #0d6efd;
        border-radius: 50%;
        animation: girar 1s linear infinite;
        margin: 0 auto;
    }

    @keyframes girar {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

</style>


</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">


<div class="card border-0 shadow-lg rounded-4 text-center"
     style="max-width: 500px; width: 100%;">

    <div class="card-body p-5">

        <div class="display-3 mb-3">
            ✅
        </div>

        <h1 class="fw-bold text-success mb-3">
            Registro Salvo Com Sucesso!
        </h1>

        <p class="text-muted mb-4">
            Seus dados foram cadastrados corretamente.
        </p>

        <div class="loader mb-4"></div>

        <p class="text-muted mb-0">
            Redirecionando...
        </p>

        <p class="small text-secondary mt-2">
            Aguarde alguns segundos.
        </p>

    </div>

</div>


</div>

</body>

</html>

<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Candidato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg border-0 rounded-4" style="max-width: 450px; width: 100%;">

        <div class="card-body p-5">

            <div class="text-center mb-4">

                <div class="display-4 mb-2">👤</div>

                <h2 class="fw-bold text-primary">
                    Login do Candidato
                </h2>

                <p class="text-muted">
                    Acesse sua área de candidato
                </p>

            </div>

            <form action="logincand2.php" method="POST">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        E-mail:
                    </label>

                    <input type="email"
                           name="email"
                           required
                           class="form-control form-control-lg"
                           placeholder="Digite seu e-mail">

                </div>

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Senha:
                    </label>

                    <div class="input-group">

                        <input type="password"
                               name="senha"
                               id="senha"
                               required
                               class="form-control form-control-lg"
                               placeholder="Digite sua senha">

                               
                               <button type="button"
                               class="btn btn-outline-secondary"
                               onclick="mostrarSenha()"
                               title="Mostrar senha">
                           <span style="color: gray;">👁</span>
                       </button>

                      
                    </div>

                </div>

                <div class="d-grid mb-3">

                    <button type="submit" class="btn btn-primary btn-lg rounded-3">
                        ENTRAR
                    </button>

                </div>

                <div class="text-center">

                    <a href="cli_cad_pro.php"
                       class="btn btn-outline-success rounded-3">
                        ✚ Cadastrar-se
                    </a>

                </div>

            </form>

            <div class="text-center mt-4">

                <a href="index.html"
                   class="btn btn-outline-secondary rounded-3">
                    ← Voltar para página inicial
                </a>

            </div>

        </div>

    </div>

</div>

<script>

function mostrarSenha() {

    const senha = document.getElementById("senha");

    if (senha.type === "password") {

        senha.type = "text";

    } else {

        senha.type = "password";

    }

}

</script>

</body>

</html>
